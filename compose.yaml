name: practice1-q18
x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: local-practice-key-not-for-production
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:postgres@postgres:5432/postgres
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:postgres@postgres:5432/postgres
  RUST_LOG: info
services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_PASSWORD: postgres
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 3s
      timeout: 5s
      retries: 30
  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: minio-root-user
      MINIO_ROOT_PASSWORD: minio-root-password
    volumes: [minio-data:/data]
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 5s
      retries: 30
  bucket:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: /bin/sh
    command: ['-c', 'mc alias set local http://minio:9000 minio-root-user minio-root-password && mc mb --ignore-existing local/lakehouse']
  migrate:
    image: quay.io/lakekeeper/catalog:v0.10.0
    environment: *lakekeeper-env
    command: [migrate]
    depends_on:
      postgres: {condition: service_healthy}
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.10.0
    environment: *lakekeeper-env
    command: [serve]
    depends_on:
      migrate: {condition: service_completed_successfully}
      bucket: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8181:8181']
    healthcheck:
      test: [CMD, /home/nonroot/lakekeeper, healthcheck]
      interval: 3s
      timeout: 5s
      retries: 30
  bootstrap:
    image: python:3.12.10-slim
    depends_on:
      lakekeeper: {condition: service_healthy}
    volumes: ['./scripts:/scripts:ro']
    command: [python, /scripts/bootstrap.py]
  trino:
    image: trinodb/trino:484
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog:ro
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/v1/info]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  runner:
    image: python:3.12.10-slim
    profiles: [tools]
    depends_on:
      trino: {condition: service_healthy}
    environment:
      TRINO_URL: http://trino:8080
      RUN_CONTEXT: ${RUN_CONTEXT:-local Docker host}
    volumes: ['.:/project']
    working_dir: /project
    command: [python, scripts/run_trino.py, --sf, '1', --repeats, '5']
  superset:
    build: ./bi
    profiles: [bi]
    depends_on:
      trino: {condition: service_healthy}
    environment:
      SUPERSET_CONFIG_PATH: /app/local/superset_config.py
      SUPERSET_SECRET_KEY: local-demo-key-change-for-any-public-deployment
    ports: ['127.0.0.1:8088:8088']
    volumes:
      - superset-data:/app/superset_home
      - ./bi:/app/local:ro
      - ./results:/evidence
    command: ['/bin/sh', '/app/local/start.sh']
volumes:
  postgres-data:
  minio-data:
  superset-data:
